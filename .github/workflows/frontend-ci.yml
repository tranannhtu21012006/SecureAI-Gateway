name: Frontend CI

on:
  push:
    branches: [ "main" ]
    # Chỉ chạy pipeline khi có thay đổi trong thư mục frontend hoặc file workflow này
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    
    # Thiết lập thư mục làm việc mặc định cho tất cả các step
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies (npm ci)
      run: npm ci

    - name: Check Types & Build (npm run build)
      run: npm run build

    - name: Test Docker Build
      run: docker build -t secureai-frontend-test -f Dockerfile --target production .
